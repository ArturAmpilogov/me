name: CI
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"

# Deployments are handled by the Vercel Git integration (preview per PR, production on main).
jobs:
  checks:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install node_modules
        run: pnpm install --frozen-lockfile
      - name: ES lint
        run: pnpm eslint
      - name: Style lint
        run: pnpm stylelint
      - name: Format check
        run: pnpm format-check
      - name: Type check
        run: pnpm type-check
      - name: Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.scss', '**/*.css') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build site
        run: pnpm build
